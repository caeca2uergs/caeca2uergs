<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="chipBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#090d15" />
    </linearGradient>
    <linearGradient id="goldPin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#e09f3e" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Pinos Laterais Dourados (Chips Pins) -->
  <!-- Top & Bottom Pins -->
  <g fill="url(#goldPin)">
    <!-- Top -->
    <rect x="30" y="4" width="8" height="12" rx="2" />
    <rect x="46" y="4" width="8" height="12" rx="2" />
    <rect x="62" y="4" width="8" height="12" rx="2" />
    <rect x="78" y="4" width="8" height="12" rx="2" />
    <rect x="94" y="4" width="8" height="12" rx="2" />

    <!-- Bottom -->
    <rect x="30" y="112" width="8" height="12" rx="2" />
    <rect x="46" y="112" width="8" height="12" rx="2" />
    <rect x="62" y="112" width="8" height="12" rx="2" />
    <rect x="78" y="112" width="8" height="12" rx="2" />
    <rect x="94" y="112" width="8" height="12" rx="2" />

    <!-- Left -->
    <rect x="4" y="30" width="12" height="8" rx="2" />
    <rect x="4" y="46" width="12" height="8" rx="2" />
    <rect x="4" y="62" width="12" height="8" rx="2" />
    <rect x="4" y="78" width="12" height="8" rx="2" />
    <rect x="4" y="94" width="12" height="8" rx="2" />

    <!-- Right -->
    <rect x="112" y="30" width="12" height="8" rx="2" />
    <rect x="112" y="46" width="12" height="8" rx="2" />
    <rect x="112" y="62" width="12" height="8" rx="2" />
    <rect x="112" y="78" width="12" height="8" rx="2" />
    <rect x="112" y="94" width="12" height="8" rx="2" />
  </g>

  <!-- Corpo do Silício / Microchip -->
  <rect x="14" y="14" width="100" height="100" rx="18" fill="url(#chipBody)" stroke="#00f0ff" stroke-width="2" />

  <!-- Trilhas de Circuito Integrado Neon Ciano -->
  <g stroke="#00f0ff" stroke-width="1.8" fill="none" opacity="0.8" filter="url(#glowCyan)">
    <!-- Trilhas canto sup esquerdo -->
    <path d="M 24 34 H 42 V 46" />
    <circle cx="42" cy="46" r="2.2" fill="#00f0ff" />

    <!-- Trilhas canto sup direito -->
    <path d="M 104 34 H 86 V 46" />
    <circle cx="86" cy="46" r="2.2" fill="#00f0ff" />

    <!-- Trilhas canto inf esquerdo -->
    <path d="M 24 94 H 42 V 82" />
    <circle cx="42" cy="82" r="2.2" fill="#00f0ff" />

    <!-- Trilhas canto inf direito -->
    <path d="M 104 94 H 86 V 82" />
    <circle cx="86" cy="82" r="2.2" fill="#00f0ff" />
  </g>

  <!-- Tipografia Central ECA² -->
  <g font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="800" text-anchor="middle">
    <text x="56" y="74" font-size="28" fill="#ffffff" letter-spacing="-0.5">E(CA)</text>
    <text x="96" y="58" font-size="21" fill="#ffb703" font-weight="900" filter="url(#glowCyan)">2</text>
  </g>
</svg>
