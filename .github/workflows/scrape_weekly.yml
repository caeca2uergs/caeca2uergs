name: Raspagem Semanal de Eventos UERGS (Porto Alegre)

on:
  schedule:
    # Executa toda segunda-feira às 06:00 UTC (03:00 Horário de Brasília)
    - cron: '0 6 * * 1'
  workflow_dispatch: # Permite disparar manualmente pelo botão no GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Executar Scraper UERGS
        run: npm run scrape:events

      - name: Commitar e Atualizar Base de Eventos
        run: |
          git config --local user.email "ca.eca2.uergs@gmail.com"
          git config --local user.name "Eca2-Bot"
          git add site/data/uergs_eventos_poa.json
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nos eventos da UERGS esta semana."
          else
            git commit -m "chore(eventos): atualização semanal automática da agenda UERGS Porto Alegre"
            git push
          fi
