name: Supabase Keep-Alive (Prevenção Automática de Pausa)

on:
  schedule:
    # Executa toda segunda e quinta-feira às 12:00 UTC (09:00 Horário de Brasília)
    # Mantém o ciclo sempre abaixo de 4 dias, prevenindo a pausa de 7 dias do Supabase
    - cron: '0 12 * * 1,4'
  workflow_dispatch:

jobs:
  keepalive:
    name: Ping Banco Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Executar Ping Anti-Pausa
        run: node scripts/supabase_keepalive.js
