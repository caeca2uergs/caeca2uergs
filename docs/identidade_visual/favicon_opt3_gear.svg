<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="gearMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="gearGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Escuro -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#090e18" stroke="#1e293b" stroke-width="2" />

  <!-- Metade Esquerda: Engrenagem Mecânica -->
  <g fill="url(#gearMetal)">
    <!-- Dentes da Engrenagem (lado esquerdo) -->
    <rect x="16" y="60" width="12" height="8" rx="1.5" />
    <rect x="22" y="38" width="10" height="8" rx="1.5" transform="rotate(-30 27 42)" />
    <rect x="36" y="22" width="10" height="8" rx="1.5" transform="rotate(-60 41 26)" />
    <rect x="60" y="16" width="8" height="10" rx="1.5" />
    <rect x="22" y="82" width="10" height="8" rx="1.5" transform="rotate(30 27 86)" />
    <rect x="36" y="98" width="10" height="8" rx="1.5" transform="rotate(60 41 102)" />
    <rect x="60" y="102" width="8" height="10" rx="1.5" />

    <!-- Corpo do anel esquerdo -->
    <path d="M 64 24 A 40 40 0 0 0 64 104 V 86 A 22 22 0 0 1 64 42 Z" />
  </g>

  <!-- Metade Direita: Rede de Circuitos e Pulso Ciano -->
  <g stroke="#00f0ff" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#gearGlow)">
    <path d="M 64 24 C 88 24 104 42 104 64 C 104 86 88 104 64 104" stroke-dasharray="6,4" />
    
    <!-- Ramificações de Circuito -->
    <path d="M 64 36 H 88 L 98 46" />
    <circle cx="98" cy="46" r="3" fill="#00f0ff" />

    <path d="M 64 64 H 108" />
    <circle cx="108" cy="64" r="3.5" fill="#ffb703" stroke="#ffb703" />

    <path d="M 64 92 H 88 L 98 82" />
    <circle cx="98" cy="82" r="3" fill="#00f0ff" />
  </g>

  <!-- Centro: E(CA)² com Fundo Circular Escuro Protegido -->
  <circle cx="64" cy="64" r="28" fill="#090e18" stroke="#1e293b" stroke-width="2" />
  
  <g font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="800" text-anchor="middle">
    <text x="57" y="72" font-size="22" fill="#ffffff">E(CA)</text>
    <text x="88" y="58" font-size="16" fill="#ffb703" font-weight="900" filter="url(#gearGlow)">2</text>
  </g>
</svg>
